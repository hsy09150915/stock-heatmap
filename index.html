<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 주식 히트맵</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
  --neutral:#f0efec; --accent:#2a78d6; --warn:#b3261e; --ok:#006300; --field:#ffffff;
  --font:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
    --neutral:#383835; --accent:#3987e5; --warn:#ff8a80; --ok:#0ca30c; --field:#232322;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
  --neutral:#383835; --accent:#3987e5; --warn:#ff8a80; --ok:#0ca30c; --field:#232322;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 var(--font)}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
h1{font-size:20px;margin:0;font-weight:700}
h2{font-size:16px;margin:0 0 8px;font-weight:700}
.spacer{flex:1}
button,select,input{font:inherit;color:var(--ink)}
button{cursor:pointer}
.btn{background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:6px 12px;min-height:36px}
.btn:hover{background:var(--grid)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav[role=tablist]{display:flex;gap:4px;border-bottom:1px solid var(--grid);margin-bottom:16px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--ink2);white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:6px 12px;min-height:36px;color:var(--ink2);border-right:1px solid var(--axis)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.lbl{font-size:12px;color:var(--muted);margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700}
.pos{color:var(--warn)} .neg{color:var(--accent)}
:root[data-theme="dark"] .neg{color:#6aa7f5}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .neg{color:#6aa7f5}}
#map{position:relative;width:100%;border-radius:8px;overflow:hidden}
.tile{position:absolute;border:0;padding:6px 8px;margin:0;text-align:left;overflow:hidden;border-radius:4px;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;font-family:var(--font)}
.tile:hover{filter:brightness(1.08);z-index:2}
.tile .tn{font-weight:700;font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .tp{font-size:12px;line-height:1.2;opacity:.95}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend .bar{flex:0 1 260px;height:10px;border-radius:5px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.18);max-width:260px;display:none}
#tip .tv{font-weight:700;font-size:15px}
#tip .ts{color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num{font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
input[type=text],input[type=number],select{background:var(--field);border:1px solid var(--axis);border-radius:6px;padding:6px 8px;min-height:36px}
input.n{width:112px;text-align:right}
input.nm{width:100%;min-width:140px}
.note{color:var(--ink2);font-size:13px}
.warn{color:var(--warn)}
.cands{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cands button{background:var(--field);border:1px solid var(--axis);border-radius:6px;padding:3px 8px;font-size:13px;min-height:32px}
.cands button:hover{border-color:var(--accent)}
.picked{color:var(--ok);font-size:13px;margin-top:2px}
.crop{display:block;max-width:240px;max-height:72px;border:1px solid var(--grid);border-radius:4px;background:#fff}
.drop{border:2px dashed var(--axis);border-radius:12px;padding:24px;text-align:center;color:var(--ink2)}
.drop.over{border-color:var(--accent);background:var(--grid)}
.cap-row td{vertical-align:top}
.empty{text-align:center;padding:40px 16px;color:var(--ink2)}
.prog{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.hide{display:none!important}
@media (max-width:640px){.wrap{padding:12px}.stat .v{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>내 주식 히트맵</h1>
  <span class="note" id="hdrNote"></span>
  <span class="spacer"></span>
  <button class="btn" id="themeBtn" aria-label="화면 색상 모드 전환">자동</button>
</header>
<nav role="tablist" aria-label="메뉴">
  <button role="tab" id="tab-heat" aria-selected="true" data-tab="heat">히트맵</button>
  <button role="tab" id="tab-cap" aria-selected="false" data-tab="cap">캡처 읽기</button>
  <button role="tab" id="tab-man" aria-selected="false" data-tab="man">종목 관리</button>
</nav>

<section id="pane-heat" role="tabpanel" aria-labelledby="tab-heat"></section>
<section id="pane-cap" role="tabpanel" aria-labelledby="tab-cap" class="hide"></section>
<section id="pane-man" role="tabpanel" aria-labelledby="tab-man" class="hide"></section>
</div>
<div id="tip" role="status"></div>
<input type="file" id="fileCodes" accept=".json,application/json" class="hide">

function saveCapture(cs){

  rows.forEach(function(r){if(!r.code||!(r.qty>0)||!(r.buy>0))bad++});
  if(!rows.length)return '반영할 행이 없어요.';
  if(bad)return '종목을 고르지 않았거나 수량·매수단가가 비어 있는 행이 '+bad+'개 있어요. 채우거나 삭제해 주세요.';
  var a;if(cs.accSel==='new'){a=cs.group.id&&acct(cs.group.id);if(!a){a={id:uid(),name:(cs.group.name||'').trim()||'계좌 '+(S.accounts.length+1),number:(cs.group.num||'').trim(),colMap:null};S.accounts.push(a);cs.group.id=a.id}}else a=acct(cs.accSel);

  if(cs.replaceAll)S.holdings=S.holdings.filter(function(x){return x.accountId!==a.id});

  rows.forEach(function(r){
    var s=BYCODE[r.code],ex=seen[r.code];

    var f=S.holdings.filter(function(x){return x.accountId===a.id&&x.code===r.code})[0];
    if(!f){f={id:uid(),accountId:a.id,code:r.code};S.holdings.push(f)}

  });
  save();cs.done=true;cs.accSel=a.id;drawCard(cs);refreshCards();renderAll();return '';
}
